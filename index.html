<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a0713">
  <title>Alexander &amp; Maria — Our Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ЛОКАЛЬНЫЙ ШРИФТ ДЛЯ ИМЁН
       ============================================================ */
    @font-face {
      font-family: 'Czizh';
      src: url('ofont.ru_Czizh.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ============================================================
       ПЕРЕМЕННЫЕ
       ============================================================ */
    :root {
      --wine-900: #16040a;
      --wine-800: #2a0713;
      --wine-700: #4a0d1f;
      --wine-600: #6d1530;
      --cherry:   #8e1f3d;
      --rose:     #c76a86;
      --cream:    #f7ede6;
      --gold:     #d9a86c;
      --polaroid: #fdf7f2;
      --white-bg: #ffffff;

      --pad-x: clamp(16px, 4vw, 60px);

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    /* ============================================================
       БАЗА
       ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--cream);
      background: var(--wine-900);
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: clamp(14px, 1.5vw, 16px);
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
      max-width: 100%;
      height: auto;
      display: block;
    }

    button { font-family: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; }

    /* ============================================================
       HERO — БОРДОВАЯ СЕКЦИЯ
       ============================================================ */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(40px + var(--safe-t))
        calc(var(--pad-x) + var(--safe-r))
        calc(48px + var(--safe-b))
        calc(var(--pad-x) + var(--safe-l));
      overflow: hidden;

      background:
        radial-gradient(1200px 600px at 50% -10%, var(--wine-600) 0%, transparent 60%),
        radial-gradient(900px 700px at 85% 110%, var(--cherry) 0%, transparent 55%),
        linear-gradient(160deg, var(--wine-800) 0%, var(--wine-900) 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0, 0, 0, .6) 100%);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      text-align: center;
      animation: fadeUp 1.1s .1s both;
    }

    .eyebrow {
      font-size: clamp(10px, 1.2vw, 12px);
      font-weight: 500;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--rose);
      opacity: .85;
      margin-bottom: clamp(14px, 2vw, 20px);
    }

    /* ---------- Имена ---------- */
    .names {
      font-family: 'Czizh', 'Playfair Display', Georgia, serif;
      font-weight: normal;
      font-size: clamp(44px, 9vw, 120px);
      line-height: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0 clamp(10px, 2vw, 26px);
      word-break: break-word;
    }

    .name {
      background: linear-gradient(180deg, #ffffff 0%, #f3d3dc 55%, var(--rose) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(199, 106, 134, .35);
      padding: 0 .05em;
    }

    .amp {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 300;
      font-size: .55em;
      color: var(--gold);
      opacity: .85;
      transform: translateY(.05em);
      line-height: 1;
    }

    /* ---------- Разделитель (без смайлов) ---------- */
    .divider {
      width: min(220px, 55%);
      height: 1px;
      margin: clamp(20px, 3vw, 28px) auto clamp(30px, 5vw, 46px);
      background: linear-gradient(90deg, transparent, var(--rose) 50%, transparent);
      opacity: .7;
    }

    /* ---------- Галерея полароидов ---------- */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(14px, 3vw, 40px);
    }

    .polaroid {
      --rot: 0deg;
      --y: 0px;
      position: relative;
      width: clamp(150px, 22vw, 240px);
      padding: clamp(10px, 1.4vw, 14px);
      border-radius: 3px;
      cursor: pointer;

      background: linear-gradient(165deg, #fffdfb 0%, var(--polaroid) 45%, #ecdfd5 100%);
      box-shadow:
        0 20px 45px rgba(0, 0, 0, .55),
        0 3px 0 rgba(0, 0, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .9);

      transform: rotate(var(--rot)) translateY(var(--y));
      transition: transform .55s cubic-bezier(.2, .9, .25, 1),
                  box-shadow .55s ease;
      animation: pop .9s cubic-bezier(.2, .9, .25, 1) backwards;
      will-change: transform;
    }

    .gallery .polaroid:nth-child(1) { --rot: -7deg; --y: 14px;  animation-delay: .35s; }
    .gallery .polaroid:nth-child(2) { --rot:  3deg; --y: -16px; animation-delay: .50s; }
    .gallery .polaroid:nth-child(3) { --rot: -4deg; --y: 14px;  animation-delay: .65s; }

    .polaroid:hover,
    .polaroid.is-active {
      z-index: 5;
      transform: rotate(0deg) translateY(calc(var(--y) - 20px)) scale(1.06);
      box-shadow: 0 34px 70px rgba(0, 0, 0, .7);
    }

    .photo {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 2px;
      background: var(--wine-800);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.03) sepia(.12);
      transition: transform .8s cubic-bezier(.2, .9, .25, 1), filter .5s ease;
    }

    .polaroid:hover .photo img,
    .polaroid.is-active .photo img {
      transform: scale(1.08);
      filter: saturate(1.15) contrast(1.05) sepia(0);
    }

    /* ---------- Фраза о любви ---------- */
    .quote {
      max-width: 660px;
      margin: clamp(34px, 6vw, 68px) auto 0;
      font-family: 'Caveat', cursive;
      font-size: clamp(22px, 3.4vw, 40px);
      line-height: 1.45;
      color: #f5dde4;
      text-shadow: 0 0 30px rgba(199, 106, 134, .45);
      padding: 0 8px;
    }

    /* ============================================================
       WHITE SECTION — БЕЛАЯ СЕКЦИЯ
       ============================================================ */
    .white-section {
      position: relative;
      background: var(--white-bg);
      color: var(--wine-600);
      padding:
        clamp(48px, 8vw, 120px)
        calc(var(--pad-x) + var(--safe-r))
        calc(clamp(48px, 8vw, 120px) + var(--safe-b))
        calc(var(--pad-x) + var(--safe-l));
      z-index: 2;
    }

    .white-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(44px, 7vw, 100px);
    }

    /* ---------- Кнопка музыки ---------- */
    .music-row {
      display: flex;
      justify-content: center;
    }

    .music-btn {
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 1.4vw, 14px);
      padding: clamp(13px, 1.6vw, 16px) clamp(22px, 3vw, 32px);
      border: 1.5px solid rgba(109, 21, 48, .3);
      background: transparent;
      color: var(--wine-600);
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      border-radius: 100px;
      cursor: pointer;
      transition: all .35s ease;
      user-select: none;
      text-align: center;
      max-width: 100%;
      line-height: 1.2;
    }

    .music-btn:hover {
      background: rgba(109, 21, 48, .06);
      border-color: rgba(109, 21, 48, .55);
      transform: translateY(-2px);
    }

    .music-btn.playing {
      background: linear-gradient(135deg, var(--cherry), var(--wine-600));
      color: #fdf7f2;
      border-color: transparent;
      box-shadow: 0 14px 34px rgba(142, 31, 61, .4);
    }

    .music-icon {
      width: clamp(18px, 2vw, 22px);
      height: clamp(18px, 2vw, 22px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .music-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .music-btn.playing .music-icon {
      animation: pulse 1.2s ease-in-out infinite;
    }

    /* ---------- Календарь ---------- */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(4px, 1vw, 8px);
    }

    .cal-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: clamp(10px, 1.6vw, 16px) 2px clamp(8px, 1.4vw, 14px);
      border-radius: clamp(10px, 1.4vw, 14px);
      transition: all .3s ease;
      min-width: 0;
    }

    .cal-day:hover {
      background: rgba(109, 21, 48, .06);
      transform: translateY(-3px);
    }

    .cal-weekday {
      font-size: clamp(9px, .9vw, 10px);
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cherry);
      opacity: .55;
    }

    .cal-date {
      font-family: 'Czizh', 'Montserrat', sans-serif;
      font-size: clamp(22px, 3.4vw, 44px);
      line-height: 1;
      color: var(--wine-600);
      font-weight: normal;
    }

    .cal-month {
      font-size: clamp(8px, .75vw, 9px);
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cherry);
      opacity: .5;
    }

    .cal-day.is-start {
      background: linear-gradient(135deg, var(--cherry), var(--wine-600));
      box-shadow: 0 12px 26px rgba(142, 31, 61, .35);
    }

    .cal-day.is-start .cal-weekday,
    .cal-day.is-start .cal-date,
    .cal-day.is-start .cal-month {
      color: #fdf7f2;
      opacity: 1;
    }

    /* ============================================================
       МЕСТО ВСТРЕЧИ
       ============================================================ */
    .meeting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: clamp(24px, 5vw, 60px);
      align-items: center;
    }

    .meeting-info {
      text-align: left;
      min-width: 0;
    }

    .meeting-title {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(26px, 3.6vw, 44px);
      line-height: 1.15;
      letter-spacing: .02em;
      color: var(--wine-600);
      margin-bottom: clamp(8px, 1.2vw, 12px);
      word-break: break-word;
    }

    .meeting-sub {
      font-size: clamp(14px, 1.4vw, 17px);
      line-height: 1.55;
      color: var(--cherry);
      opacity: .9;
      max-width: 360px;
      margin-bottom: clamp(20px, 2.4vw, 28px);
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: clamp(13px, 1.4vw, 15px) clamp(22px, 2.6vw, 32px);
      border-radius: 100px;
      border: 1.5px solid var(--wine-600);
      background: transparent;
      color: var(--wine-600);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all .35s ease;
      cursor: pointer;
      max-width: 100%;
      line-height: 1.2;
    }

    .map-btn:hover {
      background: var(--wine-600);
      color: #fdf7f2;
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(109, 21, 48, .3);
    }

    .map-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Стрелка + полароид ---------- */
    .meeting-visual {
      display: flex;
      align-items: flex-end;
      gap: clamp(4px, 1.5vw, 18px);
      flex-shrink: 0;
    }

    .meeting-pointer {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      margin-bottom: clamp(36px, 6vw, 70px);
    }

    .meeting-note {
      font-family: 'Caveat', cursive;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.05;
      color: var(--cherry);
      text-align: right;
      transform: rotate(-4deg);
    }

    .arrow-svg {
      width: clamp(70px, 9vw, 120px);
      height: auto;
      color: var(--cherry);
      opacity: .85;
      margin-top: 4px;
      transition: transform .3s ease;
    }

    .meeting-polaroid {
      --rot: 5deg;
      --y: 0;
      width: clamp(150px, 20vw, 230px);
      animation-delay: .3s;
      cursor: default;
      flex-shrink: 0;
    }

    .meeting-polaroid:hover {
      transform: rotate(var(--rot)) translateY(var(--y));
      box-shadow:
        0 20px 45px rgba(0, 0, 0, .55),
        0 3px 0 rgba(0, 0, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .meeting-polaroid:hover .photo img {
      transform: none;
      filter: saturate(1.05) contrast(1.03) sepia(.12);
    }

    /* ============================================================
       АНИМАЦИИ
       ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: rotate(calc(var(--rot) - 12deg))
                   translateY(calc(var(--y) + 60px))
                   scale(.85);
      }
      to {
        opacity: 1;
        transform: rotate(var(--rot)) translateY(var(--y)) scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }

    /* ============================================================
       ПЛАНШЕТЫ (≤ 1024px)
       ============================================================ */
    @media (max-width: 1024px) {
      .meeting {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: clamp(20px, 3vw, 40px);
      }
      .meeting-polaroid { width: clamp(140px, 20vw, 200px); }
      .arrow-svg { width: clamp(60px, 8vw, 90px); }
    }

    /* ============================================================
       МАЛЫЕ ПЛАНШЕТЫ / БОЛЬШИЕ ТЕЛЕФОНЫ (≤ 860px)
       ============================================================ */
    @media (max-width: 860px) {
      .meeting {
        grid-template-columns: 1fr;
        text-align: center;
        gap: clamp(28px, 5vw, 40px);
      }
      .meeting-info { text-align: center; }
      .meeting-sub { margin-left: auto; margin-right: auto; }
      .meeting-visual {
        justify-content: center;
        margin: 0 auto;
      }
    }

    /* ============================================================
       МОБИЛЬНЫЕ (≤ 640px)
       ============================================================ */
    @media (max-width: 640px) {

      /* --- Hero --- */
      .hero {
        padding:
          calc(32px + var(--safe-t))
          16px
          calc(40px + var(--safe-b));
      }

      .eyebrow {
        letter-spacing: .3em;
        font-size: 10px;
        margin-bottom: 14px;
      }

      /* Имена — в столбик */
      .names {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0;
        font-size: clamp(60px, 17vw, 84px);
        line-height: 1;
      }

      .name {
        display: block;
        width: 100%;
        line-height: 1;
        padding: 0;
      }

      .amp {
        display: block;
        font-size: .5em;
        margin: -4px 0 -6px;
        transform: none;
        opacity: .75;
      }

      /* Разделитель */
      .divider {
        margin: 18px auto 24px;
        width: min(160px, 50%);
      }

      /* Полароиды — 3 в один ряд */
      .gallery {
        flex-wrap: nowrap;
        gap: 6px;
        justify-content: center;
        margin: 0 auto;
      }

      .gallery .polaroid {
        flex: 1 1 0;
        min-width: 0;
        max-width: none;
        width: auto;
        padding: 6px;
        border-radius: 2px;
        --y: 0;
      }

      .gallery .polaroid:nth-child(1) { --rot: -4deg; }
      .gallery .polaroid:nth-child(2) { --rot:  3deg; }
      .gallery .polaroid:nth-child(3) { --rot: -3deg; }

      .gallery .polaroid:hover,
      .gallery .polaroid.is-active {
        transform: rotate(0deg) scale(1.08);
      }

      /* Фраза */
      .quote {
        margin-top: 26px;
        font-size: clamp(22px, 6vw, 28px);
        line-height: 1.35;
        padding: 0 4px;
      }

      /* --- Белая секция --- */
      .white-inner {
        gap: 40px;
      }

      /* Кнопка музыки — на всю ширину */
      .music-btn {
        width: 100%;
        max-width: 340px;
        justify-content: center;
        padding: 14px 20px;
        font-size: 11px;
        letter-spacing: .12em;
      }

      /* --- Календарь --- */
      .calendar { gap: 4px; }

      .cal-day {
        padding: 10px 1px 8px;
        border-radius: 10px;
        gap: 2px;
      }

      .cal-weekday {
        font-size: 8px;
        letter-spacing: .1em;
      }

      .cal-date {
        font-size: clamp(20px, 6vw, 26px);
      }

      .cal-month {
        font-size: 7px;
        letter-spacing: .1em;
      }

      /* --- Место встречи --- */
      .meeting { gap: 24px; }

      .meeting-title {
        font-size: clamp(24px, 7vw, 32px);
      }

      .meeting-sub {
        margin-bottom: 22px;
        max-width: 100%;
      }

      .map-btn {
        width: 100%;
        max-width: 340px;
        justify-content: center;
      }

      /* Полароид + стрелка: вертикальный стек */
      .meeting-visual {
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .meeting-polaroid {
        --rot: 3deg;
        width: min(64vw, 260px);
        margin-bottom: 4px;
        order: 1;
      }

      .meeting-pointer {
        align-items: center;
        margin: 0;
        order: 2;
      }

      .meeting-note {
        text-align: center;
        transform: rotate(-3deg);
        font-size: clamp(22px, 6vw, 28px);
        order: 1;
      }

      .arrow-svg {
        width: 70px;
        transform: rotate(135deg);
        margin-top: -4px;
        order: 2;
      }
    }

    /* ============================================================
       УЗКИЕ МОБИЛЬНЫЕ (≤ 480px)
       ============================================================ */
    @media (max-width: 480px) {
      .names { font-size: clamp(52px, 18vw, 72px); }

      .gallery { gap: 5px; }
      .gallery .polaroid { padding: 5px; }

      .cal-day {
        padding: 8px 0 6px;
        border-radius: 8px;
      }
      .cal-weekday { font-size: 7px; }
      .cal-date    { font-size: clamp(18px, 5.5vw, 22px); }
      .cal-month   { font-size: 6px; }

      .meeting-polaroid { width: min(70vw, 240px); }
      .arrow-svg { width: 60px; }
    }

    /* ============================================================
       ОЧЕНЬ УЗКИЕ (≤ 360px)
       ============================================================ */
    @media (max-width: 360px) {
      .names { font-size: clamp(46px, 17vw, 60px); }

      .gallery .polaroid { padding: 4px; }

      .cal-date { font-size: 18px; }
      .cal-weekday { font-size: 6.5px; }
      .cal-month { display: none; }

      .meeting-polaroid { width: 76vw; }
    }

    /* ============================================================
       БОЛЬШИЕ ЭКРАНЫ (≥ 1600px)
       ============================================================ */
    @media (min-width: 1600px) {
      .card { max-width: 1200px; }
      .white-inner { max-width: 1200px; }
      .names { font-size: clamp(112px, 8vw, 160px); }
      .polaroid { width: 260px; }
      .meeting-polaroid { width: 260px; }
    }

    /* ============================================================
       ЛАНДШАФТ НА ТЕЛЕФОНЕ
       ============================================================ */
    @media (max-height: 520px) and (orientation: landscape) {
      .hero {
        min-height: auto;
        padding-top: calc(28px + var(--safe-t));
        padding-bottom: calc(28px + var(--safe-b));
      }
      .names { font-size: clamp(36px, 7vw, 64px); }
      .gallery .polaroid { width: clamp(110px, 16vw, 150px); }
      .quote { margin-top: 18px; font-size: clamp(18px, 2.4vw, 22px); }
    }

    /* ============================================================
       ДОСТУПНОСТЬ
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @media (prefers-contrast: more) {
      .name { background: none; color: #ffffff; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HERO — БОРДОВАЯ СЕКЦИЯ
       ============================================================ -->
  <section class="hero">
    <main class="card">

      <p class="eyebrow">наша история</p>

      <h1 class="names">
        <span class="name">Alexander</span>
        <span class="amp">&amp;</span>
        <span class="name">Maria</span>
      </h1>

      <div class="divider"></div>

      <section class="gallery">
        <figure class="polaroid">
          <div class="photo"><img src="1.jpg" alt="Наше фото 1"></div>
        </figure>
        <figure class="polaroid">
          <div class="photo"><img src="2.jpg" alt="Наше фото 2"></div>
        </figure>
        <figure class="polaroid">
          <div class="photo"><img src="3.jpg" alt="Наше фото 3"></div>
        </figure>

      <p class="quote">
        «Любовь — это не то, что ты находишь.<br>
        Любовь — это то, что находит тебя.»
      </p>

    </main>
  </section>

  <!-- ============================================================
       БЕЛАЯ СЕКЦИЯ
       ============================================================ -->
  <section class="white-section">
    <div class="white-inner">

      <!-- Кнопка музыки -->
      <div class="music-row">
        <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">
          <span class="music-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </span>
          <span class="music-text" id="musicText">Нажмите чтобы включить</span>
        </button>
      </div>

      <!-- Календарь -->
      <div class="calendar">
        <div class="cal-day is-start">
          <span class="cal-weekday">Пт</span>
          <span class="cal-date">01</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Сб</span>
          <span class="cal-date">02</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Вс</span>
          <span class="cal-date">03</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Пн</span>
          <span class="cal-date">04</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Вт</span>
          <span class="cal-date">05</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Ср</span>
          <span class="cal-date">06</span>
          <span class="cal-month">янв</span>
        </div>
        <div class="cal-day">
          <span class="cal-weekday">Чт</span>
          <span class="cal-date">07</span>
          <span class="cal-month">янв</span>
        </div>
      </div>

      <!-- Место встречи -->
      <div class="meeting">

        <div class="meeting-info">
          <h2 class="meeting-title">Место встречи</h2>
          <p class="meeting-sub">г. Москва, ул. Пушкина, д. 10</p>

          <a class="map-btn"
             href="https://maps.google.com/?q=ресторан"
             target="_blank"
             rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-5.75-7-11a7 7 0 1 1 14 0c0 5.25-7 11-7 11z"/>

            </svg>
            Открыть на карте
          </a>

          <figure class="polaroid meeting-polaroid">
            <div class="photo"><img src="локация.jpg" alt="Место встречи"></div>

            <span class="meeting-note">вот тут<br>мы встретимся</span>
            <svg class="arrow-svg" viewBox="0 0 200 110" fill="none" aria-hidden="true">
              <path d="M14 96 Q 60 92, 100 62 T 178 26"
                    stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-dasharray="4 7"/>
              <path d="M178 26 L 160 22 M 178 26 L 168 42"
                    stroke="currentColor" stroke-width="2.2"

  <!-- Аудио -->
  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      'use strict';

      /* ---------- Активация полароида по клику ---------- */
      var polaroids = document.querySelectorAll('.polaroid');

      polaroids.forEach(function (card) {
        card.addEventListener('click', function () {
          var isActive = card.classList.contains('is-active');
          polaroids.forEach(function (c) { c.classList.remove('is-active'); });
          if (!isActive) card.classList.add('is-active');
        });
      });

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.polaroid')) {
          polaroids.forEach(function (c) { c.classList.remove('is-active'); });
        }
      });

      /* ---------- Кнопка музыки ---------- */
      var btn    = document.getElementById('musicBtn');
      var textEl = document.getElementById('musicText');
      var audio  = document.getElementById('bgMusic');

      btn.addEventListener('click', function (e) {
        e.stopPropagation();

        if (audio.paused) {
          var playPromise = audio.play();

          if (playPromise && typeof playPromise.then === 'function') {
            playPromise.then(function () {
              btn.classList.add('playing');
              textEl.textContent = 'Нажмите чтобы выключить';
              btn.setAttribute('aria-pressed', 'true');
            }).catch(function () {
              btn.classList.toggle('playing');
              var playing = btn.classList.contains('playing');
              textEl.textContent = playing
                ? 'Нажмите чтобы выключить'
                : 'Нажмите чтобы включить';
              btn.setAttribute('aria-pressed', String(playing));
            });
          } else {
            btn.classList.add('playing');
            textEl.textContent = 'Нажмите чтобы выключить';
            btn.setAttribute('aria-pressed', 'true');
          }
        } else {
          audio.pause();
          btn.classList.remove('playing');
          textEl.textContent = 'Нажмите чтобы включить';
          btn.setAttribute('aria-pressed', 'false');
        }
      });

    })();
  </script>
</body>
