<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexander &amp; Maria — Our Story</title>

  <!-- Montserrat для мелочей + Caveat для подписей -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ПОДКЛЮЧЕНИЕ ЛОКАЛЬНОГО ШРИФТА CZIZH (для имён)
       ============================================================ */
    @font-face {
      font-family: 'Czizh';
      src: url('ofont.ru_Czizh.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ============================================================
       ПЕРЕМЕННЫЕ
       ============================================================ */
    :root {
      --wine-900: #16040a;
      --wine-800: #2a0713;
      --wine-700: #4a0d1f;
      --wine-600: #6d1530;
      --cherry:   #8e1f3d;
      --rose:     #c76a86;
      --cream:    #f7ede6;
      --gold:     #d9a86c;
      --polaroid: #fdf7f2;
    }

    /* ============================================================
       БАЗА
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px 72px;
      overflow-x: hidden;
      position: relative;

      background:
        radial-gradient(1200px 600px at 50% -10%, var(--wine-600) 0%, transparent 60%),
        radial-gradient(900px 700px at 85% 110%, var(--cherry) 0%, transparent 55%),
        linear-gradient(160deg, var(--wine-800) 0%, var(--wine-900) 100%);
      background-attachment: fixed;
    }

    /* Виньетка по краям */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0, 0, 0, .6) 100%);
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ============================================================
       КАРТОЧКА
       ============================================================ */
    .card {
      position: relative;
      z-index: 2;
      width: min(1000px, 100%);
      text-align: center;
      animation: fadeUp 1.1s .1s both;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: var(--rose);
      opacity: .85;
      margin-bottom: 18px;
    }

    /* ============================================================
       ИМЕНА — ШРИФТ CZIZH
       ============================================================ */
    .names {
      font-family: 'Czizh', 'Playfair Display', Georgia, serif;
      font-weight: normal;
      font-size: clamp(48px, 10vw, 120px);
      line-height: 1.05;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0 22px;
    }

    .name {
      background: linear-gradient(180deg, #ffffff 0%, #f3d3dc 55%, var(--rose) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(199, 106, 134, .35);
      padding: 0 .1em;
    }

    .amp {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: .5em;
      color: var(--gold);
      opacity: .9;
      transform: translateY(-.15em);
    }

    /* ============================================================
       РАЗДЕЛИТЕЛЬ
       ============================================================ */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      max-width: 340px;
      margin: 26px auto 44px;
      color: var(--rose);
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rose));
    }

    .divider span:last-child {
      background: linear-gradient(90deg, var(--rose), transparent);
    }

    .divider i {
      font-style: normal;
      font-size: 14px;
      filter: drop-shadow(0 0 10px rgba(199, 106, 134, .9));
    }

    /* ============================================================
       ГАЛЕРЕЯ
       ============================================================ */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(16px, 3vw, 40px);
    }

    /* ============================================================
       ПОЛАРОИД
       ============================================================ */
    .polaroid {
      --rot: 0deg;
      --y: 0px;

      position: relative;
      width: clamp(150px, 22vw, 230px);
      padding: 12px 12px 0;
      border-radius: 3px;
      cursor: pointer;

      background: linear-gradient(165deg, #fffdfb 0%, var(--polaroid) 45%, #ecdfd5 100%);
      box-shadow:
        0 20px 45px rgba(0, 0, 0, .55),
        0 3px 0 rgba(0, 0, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .9);

      transform: rotate(var(--rot)) translateY(var(--y));
      transition: transform .55s cubic-bezier(.2, .9, .25, 1),
                  box-shadow .55s ease;

      animation: pop .9s cubic-bezier(.2, .9, .25, 1) backwards;
    }

    /* Лёгкий «разброс» как на столе */
    .polaroid:nth-child(1) { --rot: -7deg; --y: 14px;  animation-delay: .35s; }
    .polaroid:nth-child(2) { --rot:  3deg; --y: -16px; animation-delay: .50s; }
    .polaroid:nth-child(3) { --rot: -4deg; --y: 14px;  animation-delay: .65s; }

    .polaroid:hover,
    .polaroid.is-active {
      z-index: 5;
      transform: rotate(0deg) translateY(calc(var(--y) - 20px)) scale(1.06);
      box-shadow: 0 34px 70px rgba(0, 0, 0, .7);
    }

    .photo {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 2px;
      background: var(--wine-800);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.03) sepia(.12);
      transition: transform .8s cubic-bezier(.2, .9, .25, 1), filter .5s ease;
    }

    .polaroid:hover .photo img,
    .polaroid.is-active .photo img {
      transform: scale(1.08);
      filter: saturate(1.15) contrast(1.05) sepia(0);
    }

    figcaption {
      font-family: 'Caveat', 'Segoe Script', cursive;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1;
      color: #7a1a34;
      padding: 12px 4px 14px;
    }

    /* ============================================================
       ЦИТАТА
       ============================================================ */
    .quote {
      max-width: 640px;
      margin: clamp(40px, 6vw, 64px) auto 0;
      font-family: 'Caveat', cursive;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.5;
      color: #f2dbe2;
      text-shadow: 0 0 30px rgba(199, 106, 134, .35);
    }

    .signature {
      margin-top: 22px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--rose);
      opacity: .8;
    }

    /* ============================================================
       СЕРДЕЧКИ
       ============================================================ */
    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      will-change: transform, opacity;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      text-shadow: 0 0 14px currentColor;
      opacity: 0;
    }

    /* ============================================================
       АНИМАЦИИ
       ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: rotate(calc(var(--rot) - 12deg))
                   translateY(calc(var(--y) + 60px))
                   scale(.85);
      }
      to {
        opacity: 1;
        transform: rotate(var(--rot)) translateY(var(--y)) scale(1);
      }
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(.7);
        opacity: 0;
      }
      10% {
        opacity: var(--op, .7);
      }
      50% {
        transform: translate3d(var(--dx, 20px), -50vh, 0) rotate(180deg) scale(1);
      }
      100% {
        transform: translate3d(calc(var(--dx, 20px) * -1), -115vh, 0) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* ============================================================
       АДАПТИВ
       ============================================================ */
    @media (max-width: 760px) {
      body { padding: 40px 16px 56px; }

      .names { gap: 0 12px; }

      .gallery { gap: 26px; }

      .polaroid { width: min(64vw, 240px); }
      .polaroid:nth-child(1) { --rot: -5deg; --y: 0px; }
      .polaroid:nth-child(2) { --rot:  4deg; --y: 0px; }
      .polaroid:nth-child(3) { --rot: -3deg; --y: 0px; }

      .divider { margin-bottom: 34px; }
    }

    /* ============================================================
       ДОСТУПНОСТЬ
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
      .hearts { display: none; }
    }
  </style>
</head>
<body>

  <!-- Слой с плавающими сердечками -->
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">

    <p class="eyebrow">our story</p>

    <h1 class="names">
      <span class="name">Alexander</span>
      <span class="amp">&amp;</span>
      <span class="name">Maria</span>
    </h1>

    <div class="divider">
      <span></span><i>❤</i><span></span>
    </div>

    <!-- Галерея полароидов -->
    <section class="gallery">

      <figure class="polaroid">
        <div class="photo">
          <img src="1.jpg" alt="Our first photo">
        </div>
        <figcaption>first meeting</figcaption>
      </figure>

      <figure class="polaroid">
        <div class="photo">
          <img src="2.jpg" alt="Our second photo">
        </div>
        <figcaption>our walks</figcaption>
      </figure>

      <figure class="polaroid">
        <div class="photo">
          <img src="3.jpg" alt="Our third photo">
        </div>
        <figcaption>my favorite "us"</figcaption>
      </figure>

    </section>

    <p class="quote">
      «Love is not something you find.<br>
      Love is something that finds you.»
    </p>

    <p class="signature">forever &nbsp;♥&nbsp; together</p>

  </main>

  <script>
    /* =========================================================
       Плавающие сердечки + активный полароид (для тач-устройств)
       ========================================================= */

    (function () {
      'use strict';

      /* ---------------------------------------------------------
         1. Плавающие сердечки
         --------------------------------------------------------- */
      var layer = document.getElementById('hearts');
      var GLYPHS = ['❤', '♡', '❥', '✿', '❤', '❣'];
      var COLORS = ['#c76a86', '#e8a0b4', '#d9a86c', '#b2455f'];

      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function createHeart() {
        if (!layer || reducedMotion) return;

        var el = document.createElement('span');
        el.className = 'heart';
        el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

        var size     = 10 + Math.random() * 22;                 // px
        var duration = 9 + Math.random() * 9;                   // сек
        var drift    = (Math.random() * 180 - 90).toFixed(0);   // px
        var opacity  = (0.25 + Math.random() * 0.5).toFixed(2);

        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = size.toFixed(1) + 'px';
        el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        el.style.animationDuration = duration.toFixed(2) + 's';
        el.style.setProperty('--dx', drift + 'px');
        el.style.setProperty('--op', opacity);

        layer.appendChild(el);

        // Удаляем элемент после завершения анимации
        setTimeout(function () {
          el.remove();
        }, duration * 1000 + 300);
      }

      // Стартовая порция + постоянный поток
      if (!reducedMotion) {
        for (var i = 0; i < 6; i++) {
          setTimeout(createHeart, i * 220);
        }
        setInterval(createHeart, 750);
      }

      /* ---------------------------------------------------------
         2. Активация полароида по клику
         --------------------------------------------------------- */
      var polaroids = document.querySelectorAll('.polaroid');

      polaroids.forEach(function (card) {
        card.addEventListener('click', function () {
          var isActive = card.classList.contains('is-active');

          polaroids.forEach(function (c) {
            c.classList.remove('is-active');
          });

          if (!isActive) {
            card.classList.add('is-active');
          }
        });
      });

      /* ---------------------------------------------------------
         3. Клик вне полароидов — снять выделение
         --------------------------------------------------------- */
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.polaroid')) {
          polaroids.forEach(function (c) {
            c.classList.remove('is-active');
          });
        }
      });
    })();
  </script>
</body>
</html>
