<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a0713">
  <title>Alexander &amp; Maria — Our Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ЛОКАЛЬНЫЙ ШРИФТ ДЛЯ ИМЁН
       ============================================================ */
    @font-face {
      font-family: 'Czizh';
      src: url('ofont.ru_Czizh.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ============================================================
       ПЕРЕМЕННЫЕ
       ============================================================ */
    :root {
      --wine-900: #16040a;
      --wine-800: #2a0713;
      --wine-700: #4a0d1f;
      --wine-600: #6d1530;
      --cherry:   #8e1f3d;
      --rose:     #c76a86;
      --cream:    #f7ede6;
      --gold:     #d9a86c;
      --polaroid: #fdf7f2;
      --white-bg: #ffffff;

      --pad-x: clamp(14px, 4vw, 60px);

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    /* ============================================================
       БАЗА
       ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--cream);
      background: var(--wine-900);
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: clamp(14px, 1.5vw, 16px);
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
      max-width: 100%;
      height: auto;
      display: block;
    }

    button { font-family: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; }

    /* ============================================================
       HERO
       ============================================================ */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: flex-start;   /* контент сверху */
      justify-content: center;
      padding:
        calc(48px + var(--safe-t))
        calc(var(--pad-x) + var(--safe-r))
        calc(48px + var(--safe-b))
        calc(var(--pad-x) + var(--safe-l));
      overflow: hidden;

      background:
        radial-gradient(1200px 600px at 50% -10%, var(--wine-600) 0%, transparent 60%),
        radial-gradient(900px 700px at 85% 110%, var(--cherry) 0%, transparent 55%),
        linear-gradient(160deg, var(--wine-800) 0%, var(--wine-900) 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0, 0, 0, .6) 100%);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      text-align: center;
      animation: fadeUp 1.1s .1s both;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- ИМЕНА — ВСЕГДА В ОДНУ СТРОКУ ---------- */
    .names {
      font-family: 'Czizh', 'Playfair Display', Georgia, serif;
      font-weight: normal;
      font-size: clamp(28px, 9vw, 130px);
      line-height: 1.05;
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      justify-content: center;
      gap: 0 clamp(6px, 1.6vw, 26px);
      white-space: nowrap;
      padding: 0 4px;
    }

    .name {
      background: linear-gradient(180deg, #ffffff 0%, #f3d3dc 55%, var(--rose) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(199, 106, 134, .35);
      padding: 0 .05em;
      white-space: nowrap;
    }

    .amp {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 300;
      font-size: .6em;
      color: var(--gold);
      opacity: .9;
      transform: translateY(-.05em);
      line-height: 1;
      flex-shrink: 0;
    }

    .divider {
      width: min(260px, 60%);
      height: 1px;
      margin: clamp(24px, 3.5vw, 36px) auto clamp(36px, 5vw, 56px);
      background: linear-gradient(90deg, transparent, var(--rose) 50%, transparent);
      opacity: .7;
    }

    /* ---------- Галерея (одно фото) ---------- */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(14px, 3vw, 40px);
    }

    .polaroid {
      --rot: 0deg;
      --y: 0px;
      position: relative;
      /* ОДНО ФОТО — увеличенный размер */
      width: clamp(240px, 34vw, 400px);
      padding: clamp(12px, 1.8vw, 18px);
      border-radius: 3px;
      cursor: pointer;

      background: linear-gradient(165deg, #fffdfb 0%, var(--polaroid) 45%, #ecdfd5 100%);
      box-shadow:
        0 24px 55px rgba(0, 0, 0, .6),
        0 4px 0 rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255, 255, 255, .9);

      transform: rotate(var(--rot)) translateY(var(--y));
      transition: transform .55s cubic-bezier(.2, .9, .25, 1),
                  box-shadow .55s ease;
      animation: pop .9s cubic-bezier(.2, .9, .25, 1) backwards;
      will-change: transform;
    }

    /* Лёгкий наклон одиночного фото */
    .gallery .polaroid:only-child { --rot: -3deg; animation-delay: .3s; }
    .gallery .polaroid:nth-child(1) { --rot: -7deg; --y: 14px;  animation-delay: .35s; }
    .gallery .polaroid:nth-child(2) { --rot:  3deg; --y: -16px; animation-delay: .50s; }
    .gallery .polaroid:nth-child(3) { --rot: -4deg; --y: 14px;  animation-delay: .65s; }

    .polaroid:hover,
    .polaroid.is-active {
      z-index: 5;
      transform: rotate(0deg) translateY(calc(var(--y) - 16px)) scale(1.04);
      box-shadow: 0 40px 80px rgba(0, 0, 0, .75);
    }

    .photo {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 2px;
      background: var(--wine-800);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.03) sepia(.12);
      transition: transform .8s cubic-bezier(.2, .9, .25, 1), filter .5s ease;
    }

    .polaroid:hover .photo img,
    .polaroid.is-active .photo img {
      transform: scale(1.06);
      filter: saturate(1.15) contrast(1.05) sepia(0);
    }

    .quote {
      max-width: 660px;
      margin: clamp(40px, 6vw, 72px) auto 0;
      font-family: 'Caveat', cursive;
      font-size: clamp(20px, 3.4vw, 40px);
      line-height: 1.45;
      color: #f5dde4;
      text-shadow: 0 0 30px rgba(199, 106, 134, .45);
      padding: 0 8px;
    }

    /* ============================================================
       WHITE SECTION
       ============================================================ */
    .white-section {
      position: relative;
      background: var(--white-bg);
      color: var(--wine-600);
      padding:
        clamp(48px, 8vw, 120px)
        calc(var(--pad-x) + var(--safe-r))
        calc(clamp(48px, 8vw, 120px) + var(--safe-b))
        calc(var(--pad-x) + var(--safe-l));
      z-index: 2;
    }

    .white-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(40px, 7vw, 100px);
    }

    /* ============================================================
       КРУГЛАЯ КНОПКА МУЗЫКИ
       ============================================================ */
    .music-row { display: flex; justify-content: center; }

    .music-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .music-btn {
      width: clamp(64px, 8vw, 84px);
      height: clamp(64px, 8vw, 84px);
      border-radius: 50%;
      border: 1.5px solid rgba(109, 21, 48, .35);
      background: transparent;
      color: var(--wine-600);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .35s ease;
      user-select: none;
      padding: 0;
      flex-shrink: 0;
      position: relative;
    }

    .music-btn::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(109, 21, 48, .12);
      pointer-events: none;
      transition: all .35s ease;
    }

    .music-btn:hover {
      background: rgba(109, 21, 48, .07);
      border-color: rgba(109, 21, 48, .6);
      transform: translateY(-3px);
    }
    .music-btn:hover::after {
      border-color: rgba(109, 21, 48, .3);
      inset: -12px;
    }

    .music-btn.playing {
      background: linear-gradient(135deg, var(--cherry), var(--wine-600));
      color: #fdf7f2;
      border-color: transparent;
      box-shadow: 0 16px 40px rgba(142, 31, 61, .45);
    }
    .music-btn.playing::after {
      border-color: rgba(142, 31, 61, .35);
      inset: -14px;
    }

    .music-icon {
      width: 40%;
      height: 40%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .music-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .music-btn.playing .music-icon {
      animation: pulse 1.2s ease-in-out infinite;
    }

    .music-text {
      font-size: clamp(10px, 1.1vw, 12px);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--wine-600);
      opacity: .75;
      text-align: center;
      line-height: 1.3;
      transition: color .35s ease;
    }

    .music-block.is-playing .music-text {
      color: var(--cherry);
      opacity: 1;
    }

    /* ============================================================
       КАЛЕНДАРЬ
       ============================================================ */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(4px, 1vw, 8px);
    }

    .cal-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: clamp(10px, 1.6vw, 16px) 2px clamp(8px, 1.4vw, 14px);
      border-radius: clamp(10px, 1.4vw, 14px);
      transition: all .3s ease;
      min-width: 0;
    }

    .cal-day:hover {
      background: rgba(109, 21, 48, .06);
      transform: translateY(-3px);
    }

    .cal-weekday {
      font-size: clamp(9px, .9vw, 10px);
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cherry);
      opacity: .55;
    }

    .cal-date {
      font-family: 'Czizh', 'Montserrat', sans-serif;
      font-size: clamp(22px, 3.4vw, 44px);
      line-height: 1;
      color: var(--wine-600);
      font-weight: normal;
    }

    .cal-month {
      font-size: clamp(8px, .75vw, 9px);
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cherry);
      opacity: .5;
    }

    .cal-day.is-start {
      background: linear-gradient(135deg, var(--cherry), var(--wine-600));
      box-shadow: 0 12px 26px rgba(142, 31, 61, .35);
    }

    .cal-day.is-start .cal-weekday,
    .cal-day.is-start .cal-date,
    .cal-day.is-start .cal-month {
      color: #fdf7f2;
      opacity: 1;
    }

    /* ============================================================
       МЕСТО ВСТРЕЧИ
       ============================================================ */
    .meeting {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(24px, 4vw, 40px);
    }

    .meeting-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
    }

    .meeting-title {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(26px, 3.6vw, 44px);
      line-height: 1.15;
      letter-spacing: .02em;
      color: var(--wine-600);
      margin-bottom: clamp(8px, 1.2vw, 12px);
      word-break: break-word;
    }

    .meeting-sub {
      font-size: clamp(14px, 1.4vw, 17px);
      line-height: 1.55;
      color: var(--cherry);
      opacity: .9;
      max-width: 420px;
      margin-bottom: clamp(20px, 2.4vw, 28px);
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: clamp(13px, 1.4vw, 15px) clamp(22px, 2.6vw, 32px);
      border-radius: 100px;
      border: 1.5px solid var(--wine-600);
      background: transparent;
      color: var(--wine-600);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all .35s ease;
      cursor: pointer;
      max-width: 100%;
      line-height: 1.2;
    }

    .map-btn:hover {
      background: var(--wine-600);
      color: #fdf7f2;
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(109, 21, 48, .3);
    }

    .map-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meeting-visual {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(4px, 1.5vw, 18px);
      flex-wrap: nowrap;
      width: 100%;
    }

    .meeting-pointer {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      margin-bottom: clamp(30px, 5vw, 60px);
      flex-shrink: 0;
    }

    .meeting-note {
      font-family: 'Caveat', cursive;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.05;
      color: var(--cherry);
      text-align: right;
      transform: rotate(-4deg);
    }

    .arrow-svg {
      width: clamp(70px, 9vw, 120px);
      height: auto;
      color: var(--cherry);
      opacity: .85;
      margin-top: 4px;
      transition: transform .3s ease;
    }

    .meeting-polaroid {
      --rot: 5deg;
      --y: 0;
      width: clamp(150px, 20vw, 230px);
      animation-delay: .3s;
      cursor: default;
      flex-shrink: 0;
    }

    .meeting-polaroid:hover {
      transform: rotate(var(--rot)) translateY(var(--y));
      box-shadow:
        0 20px 45px rgba(0, 0, 0, .55),
        0 3px 0 rgba(0, 0, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .meeting-polaroid:hover .photo img {
      transform: none;
      filter: saturate(1.05) contrast(1.03) sepia(.12);
    }

    /* ============================================================
       АНИМАЦИИ
       ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: rotate(calc(var(--rot) - 12deg))
                   translateY(calc(var(--y) + 60px))
                   scale(.85);
      }
      to {
        opacity: 1;
        transform: rotate(var(--rot)) translateY(var(--y)) scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }

    /* ============================================================
       МОБИЛЬНЫЕ (≤ 640px)
       ============================================================ */
    @media (max-width: 640px) {

      .hero {
        padding:
          calc(40px + var(--safe-t))
          16px
          calc(40px + var(--safe-b));
      }

      .names {
        font-size: clamp(26px, 9vw, 50px);
        gap: 0 6px;
        padding: 0 2px;
      }
      .name { padding: 0; }
      .amp  { font-size: .7em; }

      .divider {
        margin: 18px auto 28px;
        width: min(180px, 60%);
      }

      /* Одно фото — крупное, по центру */
      .polaroid {
        width: min(82vw, 380px);
        padding: 12px;
      }

      .gallery .polaroid:only-child { --rot: -3deg; }

      .quote {
        margin-top: 34px;
        font-size: clamp(20px, 6vw, 26px);
        line-height: 1.35;
        padding: 0 4px;
      }

      .white-inner { gap: 36px; }

      .music-btn { width: 70px; height: 70px; }
      .music-btn::after { inset: -8px; }
      .music-text { font-size: 10px; letter-spacing: .16em; }

      .calendar { gap: 3px; }

      .cal-day {
        padding: 10px 1px 8px;
        border-radius: 8px;
        gap: 2px;
      }
      .cal-weekday { font-size: 8px; letter-spacing: .08em; }
      .cal-date    { font-size: clamp(18px, 5.5vw, 24px); }
      .cal-month   { font-size: 7px; letter-spacing: .08em; }

      .meeting { gap: 22px; }

      .meeting-title {
        font-size: clamp(20px, 6vw, 26px);
        margin-bottom: 4px;
      }

      .meeting-sub {
        font-size: 12px;
        line-height: 1.45;
        margin-bottom: 16px;
        max-width: 90%;
      }

      .map-btn {
        padding: 11px 20px;
        font-size: 10px;
        letter-spacing: .1em;
        gap: 8px;
      }
      .map-btn svg { width: 13px; height: 13px; }

      .meeting-visual { gap: 4px; }

      .meeting-pointer {
        margin-bottom: 30px;
        gap: 0;
        max-width: 100px;
      }

      .meeting-note {
        font-size: 14px;
        line-height: 1.05;
        transform: rotate(-5deg);
      }

      .arrow-svg {
        width: 58px;
        margin-top: 0;
      }

      .meeting-polaroid {
        width: clamp(120px, 34vw, 150px);
        --rot: 4deg;
      }
    }

    /* ============================================================
       УЗКИЕ МОБИЛЬНЫЕ (≤ 480px)
       ============================================================ */
    @media (max-width: 480px) {
      .names {
        font-size: clamp(22px, 9vw, 40px);
        gap: 0 5px;
      }

      .polaroid {
        width: min(88vw, 340px);
        padding: 11px;
      }

      .cal-day { padding: 8px 0 6px; border-radius: 7px; }
      .cal-weekday { font-size: 7px; }
      .cal-date    { font-size: clamp(16px, 5vw, 20px); }
      .cal-month   { font-size: 6px; }

      .meeting { gap: 18px; }
      .meeting-title { font-size: 20px; }
      .meeting-sub   { font-size: 11px; margin-bottom: 14px; }

      .map-btn {
        padding: 9px 16px;
        font-size: 9px;
        letter-spacing: .08em;
      }

      .meeting-pointer { margin-bottom: 24px; max-width: 88px; }
      .meeting-note    { font-size: 13px; }
      .arrow-svg       { width: 48px; }

      .meeting-polaroid { width: clamp(110px, 32vw, 135px); }
    }

    /* ============================================================
       ОЧЕНЬ УЗКИЕ (≤ 360px)
       ============================================================ */
    @media (max-width: 360px) {
      .names {
        font-size: clamp(20px, 9vw, 32px);
        gap: 0 4px;
      }

      .polaroid {
        width: min(90vw, 300px);
        padding: 10px;
      }

      .cal-date { font-size: 15px; }
      .cal-weekday { font-size: 6.5px; }
      .cal-month { display: none; }

      .meeting-pointer { margin-bottom: 20px; max-width: 78px; }
      .meeting-note    { font-size: 12px; }
      .arrow-svg       { width: 42px; }

      .meeting-polaroid { width: clamp(100px, 30vw, 120px); }
    }

    /* ============================================================
       БОЛЬШИЕ ЭКРАНЫ (≥ 1600px)
       ============================================================ */
    @media (min-width: 1600px) {
      .card { max-width: 1200px; }
      .white-inner { max-width: 1200px; }
      .polaroid { width: 440px; }
      .meeting-polaroid { width: 260px; }
    }

    /* ============================================================
       ЛАНДШАФТ НА ТЕЛЕФОНЕ
       ============================================================ */
    @media (max-height: 520px) and (orientation: landscape) {
      .hero {
        min-height: auto;
        padding-top: calc(28px + var(--safe-t));
        padding-bottom: calc(28px + var(--safe-b));
      }
      .names { font-size: clamp(36px, 7vw, 64px); }
      .polaroid { width: clamp(200px, 32vw, 280px); }
      .quote { margin-top: 18px; font-size: clamp(18px, 2.4vw, 22px); }
    }

    /* ============================================================
       ДОСТУПНОСТЬ
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @media (prefers-contrast: more) {
      .name { background: none; color: #ffffff; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <main class="card">

      <h1 class="names">
        <span class="name">Alexander</span>
        <span class="amp">&amp;</span>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      'use strict';

      var polaroids = document.querySelectorAll('.polaroid');

      polaroids.forEach(function (card) {
        card.addEventListener('click', function () {
          var isActive = card.classList.contains('is-active');
          polaroids.forEach(function (c) { c.classList.remove('is-active'); });
          if (!isActive) card.classList.add('is-active');
        });
      });

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.polaroid')) {
          polaroids.forEach(function (c) { c.classList.remove('is-active'); });
        }
      });

      var btn     = document.getElementById('musicBtn');
      var textEl  = document.getElementById('musicText');
      var block   = document.getElementById('musicBlock');
      var audio   = document.getElementById('bgMusic');

      function setPlaying(isPlaying) {
        btn.classList.toggle('playing', isPlaying);
        block.classList.toggle('is-playing', isPlaying);
        textEl.textContent = isPlaying
          ? 'Нажмите чтобы выключить'
          : 'Нажмите чтобы включить';
        btn.setAttribute('aria-pressed', String(isPlaying));
        btn.setAttribute('aria-label', isPlaying ? 'Выключить музыку' : 'Включить музыку');
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();

        if (audio.paused) {
          var playPromise = audio.play();

          if (playPromise && typeof playPromise.then === 'function') {
            playPromise.then(function () {
              setPlaying(true);
            }).catch(function () {
              setPlaying(!btn.classList.contains('playing'));
            });
          } else {
            setPlaying(true);
          }
        } else {
          audio.pause();
          setPlaying(false);
        }
      });

    })();
  </script>
